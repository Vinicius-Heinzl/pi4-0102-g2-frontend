<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F8F7FC">
  <meta name="description" content="HelpDesk — Sistema de gerenciamento de chamados de TI. Abra, acompanhe e resolva solicitações de suporte técnico.">
  <meta name="author" content="Help Desk PI IV">
  
  <title>HelpDesk — Sistema de Chamados</title>



  <!-- CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <!-- App Root -->
  <div class="app" id="app">
    <!-- Conteúdo renderizado dinamicamente via JS -->
    <div style="display:flex; align-items:center; justify-content:center; min-height:100vh; width:100%;">
      <div style="text-align:center;">
        <div class="animate-spin" style="width:40px; height:40px; margin:0 auto var(--space-4); color:var(--color-primary);">
          <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v4"/><path d="m16.2 7.8 2.9-2.9"/><path d="M18 12h4"/>
            <path d="m16.2 16.2 2.9 2.9"/><path d="M12 18v4"/><path d="m4.9 19.1 2.9-2.9"/>
            <path d="M2 12h4"/><path d="m4.9 4.9 2.9 2.9"/>
          </svg>
        </div>
        <p style="color:var(--color-text-secondary); font-size:var(--text-sm);">Carregando HelpDesk...</p>
      </div>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/data.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/router.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
