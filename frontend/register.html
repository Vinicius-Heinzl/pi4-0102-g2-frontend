<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resolve - Criar Conta</title>
    
    <!-- Estilos -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/login-page.css">
    
</head>
<body class="login-page register-page">
    <div class="login-wrapper">
        <aside class="login-welcome" aria-label="Boas-vindas">
            <svg class="login-wave" viewBox="0 0 640 1000" preserveAspectRatio="none" aria-hidden="true" focusable="false">
                <defs>
                    <linearGradient id="welcomeGreen" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0%" stop-color="#1C5546" />
                        <stop offset="100%" stop-color="#499C7E" />
                    </linearGradient>
                </defs>
                <path class="login-wave__edge" d="M0 0H570C650 220 540 320 400 420C250 540 500 750 470 1000H0Z" />
                <path fill="url(#welcomeGreen)" d="M0 0H550C630 220 520 320 380 420C230 540 480 750 450 1000H0Z" />
            </svg>
            <div class="welcome-brand">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 14v-3a9 9 0 0 1 18 0v3"/><rect x="3" y="13" width="4" height="8" rx="2"/><rect x="17" y="13" width="4" height="8" rx="2"/></svg>
                <h1>Resolve</h1>
            </div>
            <div class="welcome-message">
                <p>Bem-vindo ao Resolve!</p>
                <h2>Seu suporte<br> começa aqui.</h2>
                <span>Seu espaço de suporte de TI.</span>
            </div>
            <span class="welcome-caption">RESOLVE · CENTRAL DE SUPORTE</span>
        </aside>
        <main class="auth-main">
        <span class="login-page-label">Crie seu acesso</span>
        <div class="login-card">
            <div class="login-emblem" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="4"/><path d="M2 21v-2a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v2M19 7v6M16 10h6"/></svg>
            </div>

            <div class="login-header">
                <h2>Criar sua conta</h2>
                <p>Preencha os dados abaixo para se registrar no sistema.</p>
            </div>
            
            <form id="registerForm">
                <div class="input-group">
                    <label for="regName">Nome Completo</label>
                    <div class="input-field">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2"/></svg>
                        <input type="text" id="regName" autocomplete="name" placeholder="Seu nome completo" required />
                    </div>
                </div>

                <div class="input-group">
                    <label for="regEmail">E-mail Corporativo</label>
                    <div class="input-field">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>
                        <input type="email" id="regEmail" autocomplete="email" placeholder="nome@empresa.com.br" required />
                    </div>
                </div>

                <div class="input-group">
                    <label for="regJobTitle">Cargo</label>
                    <div class="input-field">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M8 7V3h8v4M2 12h20M12 11v3"/></svg>
                        <input type="text" id="regJobTitle" autocomplete="organization-title" placeholder="Ex: Analista de Suporte" required />
                    </div>
                </div>

                <div class="input-group">
                    <label for="regDepartment">Departamento</label>
                    <div class="input-field">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4M8 6h.01M16 6h.01M8 10h.01M16 10h.01M8 14h.01M16 14h.01"/></svg>
                        <input type="text" id="regDepartment" autocomplete="organization" placeholder="Ex: Tecnologia da Informação" required />
                    </div>
                </div>
                
                <div class="input-group">
                    <label for="regPassword">Senha</label>
                    <div class="input-field">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <input type="password" id="regPassword" autocomplete="new-password" placeholder="Mínimo 6 caracteres" required minlength="6" />
                    </div>
                </div>

                <div class="input-group">
                    <label for="regPasswordConfirm">Confirmar Senha</label>
                    <div class="input-field">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <input type="password" id="regPasswordConfirm" autocomplete="new-password" placeholder="Repita a senha" required minlength="6" />
                    </div>
                </div>
                
                <div class="error-message" role="alert" id="registerError"></div>
                
                <button type="submit" class="btn-primary" id="btnRegister">Criar Conta</button>
            </form>

            <div class="auth-footer">
                <span>Já tem uma conta?</span>
                <a href="login.html">Entrar</a>
            </div>
        </div>
        <p class="auth-caption">Resolve · Central de suporte de TI</p>
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/register.js"></script>
</body>
</html>
