<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resolve - Login</title>
    
    <!-- Estilos -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/login-page.css">
    
</head>
<body class="login-page">
    <div class="login-wrapper">
        <aside class="login-welcome" aria-label="Boas-vindas">
            <svg class="login-wave" viewBox="0 0 640 1000" preserveAspectRatio="none" aria-hidden="true" focusable="false">
                <defs>
                    <linearGradient id="welcomeGreen" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0%" stop-color="#1C5546" />
                        <stop offset="100%" stop-color="#499C7E" />
                    </linearGradient>
                </defs>
                <path class="login-wave__edge" d="M0 0H570C650 220 540 320 400 420C250 540 500 750 470 1000H0Z" />
                <path fill="url(#welcomeGreen)" d="M0 0H550C630 220 520 320 380 420C230 540 480 750 450 1000H0Z" />
            </svg>
            <div class="welcome-brand">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 14v-3a9 9 0 0 1 18 0v3"/><rect x="3" y="13" width="4" height="8" rx="2"/><rect x="17" y="13" width="4" height="8" rx="2"/></svg>
                <h1>Resolve</h1>
            </div>
            <div class="welcome-message">
                <p>Bem-vindo de volta!</p>
                <h2>Bom ter você<br> por aqui.</h2>
                <span>Seu espaço de suporte de TI.</span>
            </div>
            <span class="welcome-caption">RESOLVE · CENTRAL DE SUPORTE</span>
        </aside>
        <main class="auth-main">
        <span class="login-page-label">Acesso ao sistema</span>
        <div class="login-card">
            <div class="login-emblem" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg>
            </div>
            
            <div class="login-header">
                <h2>Acesse sua conta</h2>
                <p>Use seu e-mail e senha corporativos para entrar no sistema.</p>
            </div>
            
            <form id="loginForm">
                <div class="input-group">
                    <label for="loginEmail">E-mail Corporativo</label>
                    <div class="input-field">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>
                        <input type="email" id="loginEmail" autocomplete="username" placeholder="nome@empresa.com.br" required />
                    </div>
                </div>
                
                <div class="input-group">
                    <label for="loginPassword">Senha</label>
                    <div class="input-field">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <input type="password" id="loginPassword" autocomplete="current-password" placeholder="••••••••" required />
                        <button class="password-toggle" id="togglePassword" type="button" aria-label="Mostrar senha" aria-controls="loginPassword" aria-pressed="false">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="password-toggle__slash" d="m3 3 18 18"/></svg>
                        </button>
                    </div>
                </div>
                
                <div class="error-message" role="alert" id="loginError"></div>
                
                <button type="submit" class="btn-primary" id="btnLogin">Entrar no Resolve</button>
            </form>

            <div class="auth-footer">
                <span>Ainda não tem uma conta?</span>
                <a href="register.html">Criar Conta</a>
            </div>
        </div>
        <p class="auth-caption">Resolve · Central de suporte de TI</p>
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/auth.js"></script>
</body>
</html>
